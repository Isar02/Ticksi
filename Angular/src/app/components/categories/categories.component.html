<div class="page-container">
  <div class="content-card">

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <h2>Categories</h2>
      </div>

      <div class="toolbar-right">
        <label class="search-field">
          <span class="material-icons" aria-hidden="true">search</span>
          <input type="text" placeholder="Search categories" aria-label="Search categories" disabled />
        </label>

        <button type="button" class="add-btn" (click)="openForm()">
          <span class="material-icons" aria-hidden="true">add</span>
          Add category
        </button>
      </div>
    </div>

    <!-- Empty state -->
    <div class="empty-state" *ngIf="categories.length === 0">
      <div class="empty-icon">📂</div>
      <h3>No categories yet</h3>
      <p>Create your first category to start organizing your content.</p>
      <button type="button" class="add-btn" (click)="openForm()">
        <span class="material-icons" aria-hidden="true">add</span>
        Add category
      </button>
    </div>

    <!-- GRID ADMIN VIEW (umjesto tabele) -->
    <div class="category-grid" *ngIf="categories.length > 0">
      <div class="category-card" *ngFor="let category of categories">
        <!-- Poster -->
        <div class="category-poster">
          <ng-container *ngIf="category.posterUrl; else noPoster">
            <img
              [src]="getPosterUrl(category)"
              [alt]="category.name + ' poster'"
            />
          </ng-container>

          <ng-template #noPoster>
            <div class="no-poster">
              <span class="no-poster-icon">🖼️</span>
              <span class="no-poster-text">No image</span>
            </div>
          </ng-template>
        </div>

        <!-- Body + akcije -->
        <div class="category-body">
          <h3>{{ category.name }}</h3>
          <p class="description">
            {{ category.description || 'No description provided.' }}
          </p>

          <div class="actions">
            <button
              type="button"
              class="action-btn"
              (click)="downloadReport(category)"
              title="Download PDF report of events in this category"
            >
              <span class="material-icons" aria-hidden="true">file_download</span>
              Download PDF
            </button>

            <div class="actions-end">
              <button type="button" class="action-btn" (click)="openForm(category)">
                <span class="material-icons" aria-hidden="true">edit</span>
                Edit
              </button>

              <button type="button" class="action-btn action-btn--danger" (click)="deleteCategory(category.publicId)">
                <span class="material-icons" aria-hidden="true">delete_outline</span>
                Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
