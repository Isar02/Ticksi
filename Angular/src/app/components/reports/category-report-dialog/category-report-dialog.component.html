<form class="ticket" [formGroup]="period" (ngSubmit)="download()">
  <div class="ticket__body">
    <div class="report__head">
      <span class="ticket__badge" aria-hidden="true">
        <span class="material-icons">picture_as_pdf</span>
      </span>
      <div>
        <p class="report__eyebrow">Events report</p>
        <h2 id="report-dialog-title" class="report__title">{{ category.name }}</h2>
      </div>
    </div>

    <p id="report-dialog-message" class="ticket__message">
      Choose the period the report covers. Leave a date empty to keep that side open.
    </p>

    <div class="report__dates">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>From</mat-label>
        <input matInput type="date" formControlName="dateFrom" />
      </mat-form-field>
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>To</mat-label>
        <input matInput type="date" formControlName="dateTo" [min]="period.controls.dateFrom.value" />
      </mat-form-field>
    </div>

    @if (period.hasError('dateRange')) {
      <p class="report__error" role="alert">The end date is before the start date.</p>
    } @else {
      <p class="report__covers" aria-live="polite">
        <span class="report__covers-label">Covers</span>
        <span class="report__covers-value">{{ covers() }}</span>
      </p>
    }
  </div>

  <div class="ticket__stub">
    <button type="button" class="ticket__button ticket__button--cancel" [mat-dialog-close]="false" [disabled]="downloading()">
      Cancel
    </button>
    <button type="submit" class="ticket__button ticket__button--confirm" [disabled]="period.invalid || downloading()">
      @if (downloading()) {
        <mat-spinner diameter="16" aria-hidden="true" />
        Preparing…
      } @else {
        <span class="material-icons" aria-hidden="true">file_download</span>
        Download PDF
      }
    </button>
  </div>
</form>
