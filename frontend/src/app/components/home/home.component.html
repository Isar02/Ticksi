<section class="hero">
  <div class="hero-content">

    <h1>
      Discover events.
      <span>Create moments.</span>
    </h1>

    <p>
      Whether you're looking for unforgettable experiences or organizing your next big event,
      Ticksi brings people and events together — beautifully and simply.
    </p>

    <div class="hero-actions">
      <a routerLink="/events" class="btn-primary">Browse Events</a>
      @if (canOrganize()) {
        <button class="btn-secondary" (click)="organizeEvent()">Organize your event</button>
      }
    </div>

  </div>
</section>
