<div class="gallery" *ngIf="images?.length; else noImages">
  <div class="thumbs">
    <button
      class="thumb"
      *ngFor="let img of images; let i = index"
      type="button"
      (click)="openAt(i)"
      [attr.aria-label]="'Open image ' + (i + 1)"
    >
      <img [src]="toUrl(img)" [alt]="'Event image ' + (i + 1)" loading="lazy" />
    </button>
  </div>
</div>

<ng-template #noImages>
  <div class="gallery-empty">No images for this event.</div>
</ng-template>

<div class="gallery-modal" *ngIf="isOpen" (click)="onBackdropClick($event)">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <button class="close" type="button" (click)="close()" aria-label="Close">✕</button>

    <button class="nav left" type="button" (click)="prev()" aria-label="Previous">‹</button>
    <div
  class="full-wrap"
  #zoomWrap
  [class.zoom-hover]="hovering"
  [class.zoomed]="zoomed"
  (pointerenter)="onPointerEnter()"
  (pointerleave)="onPointerLeave()"
  (pointermove)="onPointerMove($event)"
  (click)="toggleZoom($event)"
  role="button"
  tabindex="0"
  [attr.aria-label]="zoomed ? 'Zoom out' : 'Zoom in'"
>
  <img
    class="full"
    [src]="toUrl(images[activeIndex])"
    [alt]="'Event image ' + (activeIndex + 1)"
    draggable="false"
  />
</div>

<div class="hint" *ngIf="canHover">Hover to zoom • Click to lock/unlock</div>
<div class="hint" *ngIf="!canHover">Tap to zoom • Move finger to focus</div>

    <button class="nav right" type="button" (click)="next()" aria-label="Next">›</button>

    <div class="counter">{{ activeIndex + 1 }} / {{ images.length }}</div>
  </div>
</div>
